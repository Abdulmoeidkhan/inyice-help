services:
  help:
    build: .
    image: inyice-help:latest
    init: true
    restart: unless-stopped
    ports:
      - "${HELP_BIND_ADDRESS:-0.0.0.0}:${HELP_PORT:-3001}:3001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
